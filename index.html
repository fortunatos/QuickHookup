  <style>

    /* RESET */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;

      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;

      /* Evita problemas de largura no navegador interno */
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* BACKGROUND */
    .bg {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      background:
        radial-gradient(
          circle at top left,
          #ff4d6720,
          transparent 30%
        ),
        radial-gradient(
          circle at bottom right,
          #7c3aed20,
          transparent 30%
        ),
        #0b0b0b;

      z-index: -1;
    }

    /* CARD */
    .card {
      width: 100%;
      max-width: 420px;

      margin: auto;

      background: #121212;

      border: 1px solid #262626;
      border-radius: 24px;

      padding: 40px 30px;

      text-align: center;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, .5);
    }

    /* ICON */
    .icon {
      font-size: 58px;
      line-height: 1;

      margin-bottom: 20px;
    }

    /* TITLE */
    h1 {
      font-size: 2rem;
      line-height: 1.2;

      margin-bottom: 15px;
    }

    /* TEXT */
    p {
      color: #b3b3b3;

      line-height: 1.7;

      margin-bottom: 30px;
    }

    /* BUTTONS */
    .buttons {
      display: flex;
      flex-direction: column;

      width: 100%;

      gap: 15px;
    }

    /* BUTTON */
    .btn {
      display: block;

      width: 100%;

      text-decoration: none;

      padding: 16px;

      border-radius: 14px;

      font-weight: bold;
      text-align: center;

      transition: .25s ease;
    }

    /* ENTER */
    .enter {
      background:
        linear-gradient(
          90deg,
          #ff4d67,
          #ff758c
        );

      color: white;

      box-shadow:
        0 10px 30px rgba(255, 77, 103, .25);
    }

    .enter:hover {
      transform: translateY(-2px);
    }

    /* EXIT */
    .exit {
      background: #1d1d1d;

      border: 1px solid #333;

      color: #ccc;
    }

    /* FOOTER */
    .footer {
      margin-top: 25px;

      color: #666;

      font-size: .85rem;

      line-height: 1.5;
    }

    /* MOBILE */
    @media (max-width: 480px) {

      body {
        padding: 15px;
      }

      .card {
        padding: 32px 22px;

        border-radius: 20px;
      }

      .icon {
        font-size: 52px;
      }

      h1 {
        font-size: 1.7rem;
      }

    }

  </style>

</head>

<body>

  <div class="bg"></div>

  <main class="card">

    <div class="icon">
      🔞
    </div>

    <h1>
      Age Verification
    </h1>

    <p>
      You must be 18 years or older to access this website.
      Please confirm your age before continuing.
    </p>

    <div class="buttons">

      <a href="go.html" class="btn enter">
        I Am 18+ Continue
      </a>

      <a href="go.html" class="btn exit">
        Exit
      </a>

    </div>

    <div class="footer">
      By continuing, you confirm that you meet the legal age requirements.
    </div>

  </main>

</body>

</html>
