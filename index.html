<script>
function forcarAberturaExterna(event) {
  if (event && event.preventDefault) event.preventDefault();

  const urlDestino = "https://activemembers.site/go.html";
  const urlLimpa = urlDestino.replace(/^https?:\/\//i, "");
  const ua = navigator.userAgent || navigator.vendor || window.opera || "";
  const isAndroid = /Android/i.test(ua);
  const isIOS = /iPhone|iPad|iPod/i.test(ua);

  // Helper para simular clique nativo no DOM (Bypassa restrições de script)
  function dispararClique(linkHref) {
    const a = document.createElement("a");
    a.href = linkHref;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  // ==========================================
  // ESTRATÉGIA ANDROID (X / Twitter / Insta / TikTok)
  // ==========================================
  if (isAndroid) {
    // Vetor 1: Intent Direto do Chrome
    const intentChrome = 
      "intent://" + urlLimpa + 
      "#Intent;scheme=https;package=com.android.chrome;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;S.browser_fallback_url=" + 
      encodeURIComponent(urlDestino) + ";end;";

    // Vetor 2: Intent Universal do Android (Pega qualquer navegador se o Chrome falhar)
    const intentUniversal = 
      "intent://" + urlLimpa + 
      "#Intent;scheme=https;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;end;";

    // Vetor 3: Deep Link Nativo
    const chromeScheme = "googlechrome://navigate?url=" + encodeURIComponent(urlDestino);

    // 1. Tenta Chrome Intent via clique simulado
    try {
      dispararClique(intentChrome);
    } catch (e) {}

    // 2. Tenta Intent Universal após 100ms
    setTimeout(function() {
      try {
        dispararClique(intentUniversal);
      } catch (e) {}
    }, 100);

    // 3. Tenta protocolo direto após 250ms
    setTimeout(function() {
      try {
        window.location.href = chromeScheme;
      } catch (e) {}
    }, 250);

    // 4. Fallback final: Redirecionamento forçado em 500ms caso a WebView bloqueie tudo
    setTimeout(function() {
      window.location.replace(urlDestino);
    }, 500);

    return;
  }

  // ==========================================
  // ESTRATÉGIA iOS (Safari / WebViews do iPhone)
  // ==========================================
  if (isIOS) {
    // No iOS, se window.open falhar, forçamos via topo da janela
    try {
      window.top.location.href = urlDestino;
    } catch (e) {
      window.location.href = urlDestino;
    }
    return;
  }

  // ==========================================
  // COMPUTADOR / DESKTOP
  // ==========================================
  window.open(urlDestino, "_blank", "noopener,noreferrer");
}

// Opcional: Se você quiser disparar AUTOMATICAMENTE assim que a página carregar:

});
</script>
