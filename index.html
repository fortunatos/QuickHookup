<script>
function abrirGo(event) {
  if (event) event.preventDefault();

  const urlFinal = "https://activemembers.site/go.html";
  const ua = navigator.userAgent || navigator.vendor || window.opera || "";
  const isAndroid = /Android/i.test(ua);

  if (isAndroid) {
    const urlSemProtocolo = urlFinal.replace(/^https?:\/\//i, "");

    // 1. Tenta o esquema direto do Chrome (funciona onde o Intent é bloqueado)
    const chromeScheme = "googlechrome://navigate?url=" + urlFinal;

    // 2. Intent padrão formatado estritamente
    const chromeIntent = 
      "intent://" + urlSemProtocolo + 
      "#Intent;scheme=https;package=com.android.chrome;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;end;";

    // Criamos um iframe invisível para testar o Intent sem travar a tela com o erro de "Nenhum aplicativo"
    const iframe = document.createElement("iframe");
    iframe.style.display = "none";
    document.body.appendChild(iframe);

    try {
      // Tenta abrir pelo Intent via iframe
      iframe.src = chromeIntent;
    } catch (e) {
      // Ignora erro se for bloqueado
    }

    // Tenta também via link simulado de Chrome Scheme
    setTimeout(function() {
      try {
        window.location.href = chromeScheme;
      } catch(e) {}
    }, 200);

    // Fallback: Se em 1 segundo o app não tiver aberto o Chrome externo,
    // ele abre o link normalmente sem travar o usuário
    setTimeout(function () {
      if (document.body.contains(iframe)) {
        document.body.removeChild(iframe);
      }
      window.location.href = urlFinal;
    }, 1000);

    return;
  }

  // iOS (iPhone/iPad) e Computador (Desktop)
  window.location.href = urlFinal;
}
</script>
