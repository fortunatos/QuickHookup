  <style>

    * {

      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-width: 0;
      max-width: 100%;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;

      font-family: Arial, sans-serif;

      background: #fff;

      width: 100%;

      min-height: 100vh;
      min-height: 100dvh;

      overflow-x: hidden;
      overflow-y: auto;
    }

    /* Container central */
    .page {
      width: 100%;
      min-width: 0;

      min-height: 100vh;
      min-height: 100dvh;

      display: grid;
      place-items: center;

      padding: 20px;
    }

    .loading {
      width: 100%;
      text-align: center;
    }

    .spinner {
      border: 6px solid #f3f3f3;
      border-top: 6px solid #333;

      border-radius: 50%;

      width: 50px;
      height: 50px;

      margin: 20px auto;

      animation: spin 1s linear infinite;
    }

    .loading p {
      margin: 0;

      font-size: 16px;
      line-height: 1.5;

      color: #333;
    }

    @keyframes spin {

      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }

    }

    /* Celular */
    @media (max-width: 480px) {

      .page {
        padding: 15px;
      }

      .loading {
        width: 100%;
      }

    }

  </style>
